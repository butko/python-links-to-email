# ═══════════════════════════════════════════════════════════════════════
#  Конфигурация скрипта мониторинга новых ссылок
#  Формат: INI (секции в квадратных скобках, параметры КЛЮЧ = ЗНАЧЕНИЕ)
# ═══════════════════════════════════════════════════════════════════════


# ─────────────────────────────── SMTP ─────────────────────────────────
# Настройки почтового сервера, через который отправляются письма.
# EMAIL — адрес получателя уведомлений.
[smtp]
EMAIL = recipient@example.com

# Данные SMTP-сервера отправителя
SMTP_SERVER = smtp.example.com
SMTP_PORT = 587
SMTP_USER = sender@example.com
SMTP_PASSWORD = your_app_password

# ─── Параметры вложений фотографий из постов ВКонтакте ───
# ATTACH_PHOTOS: yes / no — прикреплять ли фото к письму
# PHOTO_TARGET_WIDTH: желаемая ширина фото (px). Сервис вернёт ближайший размер
# PHOTO_MAX_COUNT: максимум фото в одном письме
# PHOTO_MAX_KB: максимум размера одной картинки (КБ)
ATTACH_PHOTOS = yes
PHOTO_TARGET_WIDTH = 600
PHOTO_MAX_COUNT = 10
PHOTO_MAX_KB = 500


# ────────────────────────── VK API (общий токен) ──────────────────────
# Токен применяется ко всем VK-источникам, у которых не задан свой api_token.
# Как получить токен — см. README.
[vk]
api_token = your_vk_access_token
api_version = 5.199


# ═══════════════════════════════════════════════════════════════════════
#  ИСТОЧНИКИ
#  Каждый источник — отдельная секция [sourceN] со своим именем.
#  Параметры:
#    url         — обязательный, адрес страницы для сканирования
#    filters     — необязательный, список regex-паттернов через запятую.
#                  Ссылка остаётся, если соответствует хотя бы одному.
#                  Если не задан — берутся все ссылки.
#    type        — необязательный: vk | web. Если не задан, определяется
#                  автоматически по домену (vk.com, vk.ru, vkvideo.ru, ...)
#    api_token   — необязательный, только для VK. Иначе берётся общий из [vk]
#    api_version — необязательный, только для VK. Иначе берётся из [vk]
#    count       — необязательный, только для VK. Сколько последних постов
#                  загружать (максимум 100 за один запрос)
# ═══════════════════════════════════════════════════════════════════════


# ─── Обычный сайт: раздел новостей ───
[source_news]
url = https://example.com/news
filters = /news/


# ─── Обычный сайт: вторая страница новостей ───
[source_news_page2]
url = https://example.com/news?page=2%2C1
filters = /news/


# ─── Обычный сайт: раздел библиотеки ───
[source_library]
url = https://library.example.com/catalog
filters = /catalog/


# ─── Канал ВКонтакте: публичная страница сообщества ───
[source_vk_community]
url = https://vk.ru/example_community
filters = wall-
count = 100


# ─── Канал VK Видео: страница автора ───
[source_vk_video]
url = https://vkvideo.ru/@example_author
filters = clip-, video-
count = 100